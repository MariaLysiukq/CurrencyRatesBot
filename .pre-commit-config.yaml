repos:
  - repo: local
    hooks:
      - id: isort
        name: Sort Python imports
        entry: isort
        language: system
        types: [python]
        args: ["--settings-path=setup.cfg", "..."]

      - id: flake8
        name: Check Python code
        entry: flake8
        language: system
        types: [python]
        args: ["--config=setup.cfg"]
